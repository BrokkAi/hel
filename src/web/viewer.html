<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#08090d" />
    <link rel="icon" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/viewer.css" />
    <title>Hel</title>
  </head>
  <body>
    <header>
      <div>
        <h1>HEL</h1>
        <div class="dim">Welcome to Hel.</div>
      </div>
      <button id="logout" class="hidden">Sign out</button>
    </header>

    <main id="login" class="card">
      <h2>Unlock viewer</h2>
      <p class="dim">Enter the six-digit code shown by <code>hel daemon status</code>.</p>
      <form id="login-form" class="row">
        <input
          id="code"
          inputmode="numeric"
          autocomplete="one-time-code"
          pattern="[0-9]{6}"
          maxlength="6"
          placeholder="000000"
          required
        />
        <button>Enter</button>
      </form>
      <p id="login-error"></p>
    </main>

    <main id="app" class="hidden">
      <section id="dashboard">
        <section class="card">
          <h2>New session</h2>
          <form id="new-form" class="row">
            <input id="new-title" maxlength="120" placeholder="Session title" required />
            <select id="new-profile" aria-label="Profile"></select>
            <select id="new-bundle" aria-label="Bundle"></select>
            <select id="new-target" aria-label="Target"></select>
            <input
              id="new-project-directory"
              class="hidden"
              placeholder="Absolute project directory"
            />
            <button>Start</button>
          </form>
          <p id="action-error"></p>
        </section>
        <section>
          <h2>Sessions</h2>
          <div id="sessions"></div>
        </section>
        <section class="card">
          <h2>Configured</h2>
          <div id="configured"></div>
        </section>
      </section>

      <section id="conversation" class="hidden">
        <button id="back" class="secondary">← Dashboard</button>
        <div class="card">
          <h2 id="conversation-title">Conversation</h2>
          <span id="conversation-state" class="pill"></span>
          <div id="conversation-feed"></div>
        </div>
        <div id="elicitations"></div>
        <section class="card">
          <h3>Queued prompts</h3>
          <div id="conversation-queue"></div>
          <h3>Shell commands</h3>
          <div id="conversation-shells"></div>
        </section>
        <form id="prompt-form" class="card">
          <div
            id="prompt-text"
            class="composer-input"
            contenteditable="true"
            role="textbox"
            aria-multiline="true"
            enterkeyhint="send"
            spellcheck="true"
            aria-label="Message the agent"
            data-placeholder="Message the agent or use !command"
          ></div>
          <div id="attachments" class="row" aria-label="Attached images"></div>
          <div class="row">
            <button>Send or queue</button>
            <button
              type="button"
              id="attach-image"
              class="secondary"
              aria-label="Attach one or more images"
              hidden
            >
              Images
            </button>
            <input id="image-picker" type="file" accept="image/*" multiple hidden />
          </div>
          <p id="conversation-error"></p>
        </form>
      </section>
    </main>

    <script type="module" src="/viewer.js"></script>
  </body>
</html>
