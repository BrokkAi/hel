[package]
name = "hel-tui"
version = "0.2.0"
edition = "2024"
description = "Terminal UI widgets and views for Hel"
license = "GPL-3.0-only"
repository = "https://github.com/BrokkAi/hel"
publish = true

[lints]
workspace = true

[dependencies]
hel = { path = "../..", package = "hel-core", version = "0.2.0" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
crossterm = { version = "0.29", features = ["event-stream"] }
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
serde_json = "1"
sha2 = "0.10"
qrcode = { version = "0.14", default-features = false }
