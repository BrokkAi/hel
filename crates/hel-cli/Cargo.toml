[package]
name = "hel-cli"
version.workspace = true
edition = "2024"
rust-version.workspace = true
description = "Hel: session control plane for ACP coding agents (installs the `hel` binary)"
license = "GPL-3.0-only"
repository = "https://github.com/BrokkAi/hel"
publish = true

[lints]
workspace = true

[[bin]]
name = "hel"
path = "src/main.rs"

[features]
default = []
test-hooks = ["hel/test-hooks"]

[dependencies]
hel.workspace = true
hel-tui.workspace = true
agent-client-protocol = { version = "2", features = ["unstable_session_fork", "unstable_end_turn_token_usage", "unstable_elicitation", "unstable_auth_methods"] }
anyhow = "1"
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive", "env"] }
crossterm = { version = "0.29", features = ["event-stream", "osc52"] }
dirs = "6"
getrandom = "0.3"
libc = "0.2"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[target.'cfg(all(target_os = "linux", target_env = "musl"))'.dependencies]
mimalloc = "0.1"

[dev-dependencies]
libc = "0.2"
tempfile = "3"
