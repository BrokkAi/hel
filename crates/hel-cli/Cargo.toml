[package]
name = "hel-cli"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[[bin]]
name = "hel"
path = "src/main.rs"

[dependencies]
hel = { path = "../.." }
hel-tui = { path = "../hel-tui" }
agent-client-protocol = { version = "1", features = ["unstable_session_fork", "unstable_end_turn_token_usage", "unstable_elicitation", "unstable_auth_methods"] }
anyhow = "1"
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive", "env"] }
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "6"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
serde_json = "1"
sysinfo = "0.32"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

[dev-dependencies]
libc = "0.2"
tempfile = "3"
