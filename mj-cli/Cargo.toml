[package]
name = "brokk-mjolnir"
version.workspace = true
edition = "2024"
rust-version.workspace = true
description = "Mjolnir: session control plane for ACP coding agents (installs the `mj` binary)"
license = "GPL-3.0-only"
repository = "https://github.com/BrokkAi/mjolnir"
publish = true

[lints]
workspace = true

[[bin]]
name = "mj"
path = "src/main.rs"

[features]
default = ["desktop-app"]
# The desktop dependencies are declared only for the platforms the shell
# supports (glibc Linux, macOS, Windows), so the feature is inert on musl —
# the primary CI target — and on any other platform.
desktop-app = ["dep:mj-desktop", "dep:rcgen", "dep:axum", "dep:reqwest"]
test-hooks = ["hel/test-hooks"]

[dependencies]
hel.workspace = true
hel-tui.workspace = true
agent-client-protocol = { version = "2", features = ["unstable_session_fork", "unstable_end_turn_token_usage", "unstable_elicitation", "unstable_auth_methods"] }
anyhow = "1"
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive", "env"] }
crossterm = { version = "0.29", features = ["event-stream", "osc52"] }
dirs = "6"
getrandom = "0.3"
libc = "0.2"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[target.'cfg(all(target_os = "linux", target_env = "musl"))'.dependencies]
mimalloc = "0.1"

# The native desktop shell and the pieces only `mj app` needs. Declared per
# platform rather than unconditionally so the desktop-app feature stays inert
# on musl and Android instead of dragging WebKit into static builds.
[target.'cfg(any(target_os = "macos", target_os = "windows", all(target_os = "linux", target_env = "gnu")))'.dependencies]
mj-desktop = { workspace = true, optional = true }
rcgen = { version = "0.13", optional = true }
axum = { version = "0.8", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"], optional = true }

[dev-dependencies]
libc = "0.2"
# Same spec as brokk-mj-core's, so the features unify and SQLite compiles once. The
# store-divergence test migrates the daemon's store from outside the daemon,
# which is exactly what the incident it reproduces did.
rusqlite = { version = "0.37", features = ["bundled"] }
tempfile = "3"
