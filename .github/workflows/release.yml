name: Release Hel

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux-amd64:
    name: Build hel for x86_64-unknown-linux-gnu
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      # Ubuntu 22.04 keeps the glibc requirement compatible with older
      # supported Linux hosts.
      - name: Build controller
        run: cargo build --release --locked --bin hel --target x86_64-unknown-linux-gnu

      - name: Upload controller
        uses: actions/upload-artifact@v7
        with:
          name: hel-controller-x86_64-unknown-linux-gnu
          path: target/x86_64-unknown-linux-gnu/release/hel
          if-no-files-found: error

  build-linux-arm64:
    name: Build hel for aarch64-unknown-linux-gnu
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Build controller
        run: cargo build --release --locked --bin hel --target aarch64-unknown-linux-gnu

      - name: Upload controller
        uses: actions/upload-artifact@v7
        with:
          name: hel-controller-aarch64-unknown-linux-gnu
          path: target/aarch64-unknown-linux-gnu/release/hel
          if-no-files-found: error

  build-macos-arm64:
    name: Build hel for aarch64-apple-darwin
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Build controller
        run: cargo build --release --locked --bin hel --target aarch64-apple-darwin

      - name: Upload controller
        uses: actions/upload-artifact@v7
        with:
          name: hel-controller-aarch64-apple-darwin
          path: target/aarch64-apple-darwin/release/hel
          if-no-files-found: error

  build-worker-amd64:
    name: Build worker for x86_64-unknown-linux-musl
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl linker
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --assume-yes musl-tools

      - name: Build static worker
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked --bin hel --target x86_64-unknown-linux-musl

      - name: Stage named worker
        run: |
          mkdir workers
          cp target/x86_64-unknown-linux-musl/release/hel \
            workers/hel-worker-x86_64-unknown-linux-musl

      - name: Upload worker
        uses: actions/upload-artifact@v7
        with:
          name: hel-worker-x86_64-unknown-linux-musl
          path: workers/hel-worker-x86_64-unknown-linux-musl
          if-no-files-found: error

  build-worker-arm64:
    name: Build worker for aarch64-unknown-linux-musl
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - name: Install musl linker
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --assume-yes musl-tools

      - name: Build static worker
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked --bin hel --target aarch64-unknown-linux-musl

      - name: Stage named worker
        run: |
          mkdir workers
          cp target/aarch64-unknown-linux-musl/release/hel \
            workers/hel-worker-aarch64-unknown-linux-musl

      - name: Upload worker
        uses: actions/upload-artifact@v7
        with:
          name: hel-worker-aarch64-unknown-linux-musl
          path: workers/hel-worker-aarch64-unknown-linux-musl
          if-no-files-found: error

  package:
    name: Package ${{ matrix.target }}
    needs:
      - build-linux-amd64
      - build-linux-arm64
      - build-macos-arm64
      - build-worker-amd64
      - build-worker-arm64
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v6

      - name: Download controller
        uses: actions/download-artifact@v8
        with:
          name: hel-controller-${{ matrix.target }}
          path: staging/controller

      - name: Download x86_64 worker
        uses: actions/download-artifact@v8
        with:
          name: hel-worker-x86_64-unknown-linux-musl
          path: staging/workers

      - name: Download aarch64 worker
        uses: actions/download-artifact@v8
        with:
          name: hel-worker-aarch64-unknown-linux-musl
          path: staging/workers

      - name: Create archive and checksum
        shell: bash
        run: |
          set -euo pipefail
          archive="hel-${{ matrix.target }}"
          mkdir -p "dist/$archive"
          cp staging/controller/hel "dist/$archive/hel"
          cp staging/workers/hel-worker-x86_64-unknown-linux-musl "dist/$archive/"
          cp staging/workers/hel-worker-aarch64-unknown-linux-musl "dist/$archive/"
          cp LICENSE "dist/$archive/"
          chmod 0755 "dist/$archive/hel" "dist/$archive"/hel-worker-*
          tar -C dist -czf "$archive.tar.gz" "$archive"
          sha256sum "$archive.tar.gz" > "$archive.tar.gz.sha256"

      - name: Upload release asset
        uses: actions/upload-artifact@v7
        with:
          name: hel-release-${{ matrix.target }}
          path: |
            hel-${{ matrix.target }}.tar.gz
            hel-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: package
    runs-on: ubuntu-22.04
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          pattern: hel-release-*
          path: release-assets
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            release-assets/hel-*.tar.gz
            release-assets/hel-*.tar.gz.sha256
