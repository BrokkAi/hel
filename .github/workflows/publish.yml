name: Publish to crates.io

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing Hel release tag to package, in the form vX.Y.Z
        required: true
        type: string
      publish:
        description: Publish to crates.io after every packaging check passes
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  package:
    name: Verify and package
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
      CARGO_BUILD_TARGET: x86_64-unknown-linux-musl

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --assume-yes libasound2-dev musl-tools

      - name: Verify tag, manifests, and lockfile agree
        run: |
          node scripts/release-version.mjs check "$RELEASE_TAG"
          cargo metadata --locked --format-version 1 >/dev/null

      - name: Package crates
        run: |
          # Only crates without in-workspace registry dependencies can be
          # packaged before publishing: cargo package requires a dependency to
          # exist in the index even with --no-verify, and hel-core is not there
          # until this same release publishes it. hel-tui and hel-cli are
          # packaged (and verify-built) by cargo publish itself, which runs in
          # dependency order after hel-core is live.
          cargo package --locked -p hel-core
          CARGO_BUILD_TARGET=x86_64-unknown-linux-gnu \
            cargo package --locked -p hel-voice-worker

      - uses: actions/upload-artifact@v7
        with:
          name: crate-packages-${{ env.RELEASE_TAG }}
          path: target/package/*.crate
          if-no-files-found: error

  publish:
    name: Publish crates
    needs: package
    if: github.event_name == 'release' || inputs.publish
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      id-token: write
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
      CARGO_BUILD_TARGET: x86_64-unknown-linux-musl

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --assume-yes libasound2-dev musl-tools

      - name: Authenticate to crates.io
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish crates that are not on the registry yet
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          # crates.io permanently reserves a version number once it is
          # published, and yanking does not release it, so an already-shipped
          # version must be skipped rather than republished. This also makes a
          # retry resume after a partial publish instead of turning red.
          already_published() {
            local crate="$1" path response status body
            case "${#crate}" in
              1) path="1/$crate" ;;
              2) path="2/$crate" ;;
              3) path="3/${crate:0:1}/$crate" ;;
              *) path="${crate:0:2}/${crate:2:2}/$crate" ;;
            esac
            response="$(curl --silent --show-error --retry 3 --retry-all-errors \
              --write-out '\n%{http_code}' "https://index.crates.io/$path")"
            status="${response##*$'\n'}"
            body="${response%$'\n'*}"
            case "$status" in
              # A crate with no releases at all is absent from the index.
              404) return 1 ;;
              200)
                jq --exit-status --arg version "$version" \
                  'select(.vers == $version)' >/dev/null <<<"$body"
                ;;
              # Never read a failed lookup as "not published" — errexit does not
              # apply inside a function used as an if condition, so bail out by
              # hand rather than letting an index outage become a publish.
              *)
                echo "crates.io index lookup for $crate failed with HTTP $status" >&2
                exit 1
                ;;
            esac
          }
          # Dependency order: cargo publish waits for each crate to reach the
          # index before returning, so the next crate in the chain resolves.
          for crate in hel-core hel-tui hel-cli hel-voice-worker; do
            if already_published "$crate"; then
              echo "$crate $version is already on crates.io, skipping"
              continue
            fi
            if [ "$crate" = hel-voice-worker ]; then
              CARGO_BUILD_TARGET=x86_64-unknown-linux-gnu \
                cargo publish --locked -p "$crate"
            else
              cargo publish --locked -p "$crate"
            fi
          done
