[package]
name = "hel"
version = "0.1.0"
edition = "2024"
description = "Session control plane for ACP coding agents"
license = "GPL-3.0-only"
publish = true
include = [
    "src/**/*.rs",
    "tests/termination_pty.rs",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "LICENSE",
    "licenses/THIRD_PARTY_LICENSES.html",
    "licenses/SUPPLEMENTAL_THIRD_PARTY_NOTICES.txt",
]

[workspace]
members = ["voice-worker"]
default-members = ["."]

[[bin]]
name = "hel"
path = "src/hel_main.rs"

[dependencies]
agent-client-protocol = { version = "1", features = ["unstable_session_fork", "unstable_end_turn_token_usage", "unstable_elicitation", "unstable_auth_methods"] }
anyhow = "1"
axum = "0.8"
# Use the ring provider already pulled by reqwest instead of aws-lc-rs, which
# needs a C toolchain and complicates cross-compilation.
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
base64 = "0.22"
# `clock` pulls `iana-time-zone`/`android-tzdata` so `Local` can render reset
# timestamps in the machine's wall-clock time (DST-correct); `default-features
# = false` drops the wasm-only bits.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive", "env"] }
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "6"
getrandom = "0.3"
# HMAC-SHA256 signs the stateless remote-viewer session cookie (keyed on a
# persisted signing key); pairs with the existing `sha2`.
hmac = "0.12"
# Resolves the IANA zone name (e.g. "Europe/Paris") to append to reset times.
iana-time-zone = "0.1"
libc = "0.2"
pulldown-cmark = { version = "0.10", default-features = false }
signal-hook = "0.3"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "stream"] }
rayon = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = "2.7"
tar = "0.4"
tempfile = "3"
textwrap = "0.16"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat", "rt"] }
toml = "0.8"
tracing = "0.1"
unicode-segmentation = "1"
url = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
